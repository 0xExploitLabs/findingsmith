<!doctype html>
<html lang="en" data-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Debrief - pentest report writer</title>
    <meta name="description" content="Write penetration test reports in Markdown, score findings with CVSS 3.1 and 4.0, and export a clean PDF. Runs entirely in your browser." />
    <meta name="theme-color" content="#f8f8fa" />
    <script>
      (() => {
        var s;
        try { s = localStorage.getItem("debrief-scheme"); } catch {}
        if (s !== "light" && s !== "dark") s = "light";
        document.documentElement.dataset.scheme = s;
      })();
    </script>
  </head>
  <body spellcheck="false">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
