<!doctype html>
<html lang="en" data-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link id="icon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link id="icon-png" rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Findingsmith - pentest report writer, by 0xExploitLabs</title>
    <link rel="canonical" href="https://findingsmith.0xexploitlabs.org/" />
    <meta property="og:title" content="Findingsmith - pentest reports, written like notes" />
    <meta property="og:site_name" content="Findingsmith by 0xExploitLabs" />
    <meta property="og:url" content="https://findingsmith.0xexploitlabs.org/" />
    <meta property="og:type" content="website" />
    <meta name="description" content="Write penetration test reports in Markdown, score findings with CVSS 3.1 and 4.0, and export a clean PDF. Runs entirely in your browser." />
    <meta id="bar" name="theme-color" content="#f8f8fa" />
    <script>
      (() => {
        var s;
        try { s = localStorage.getItem("debrief-scheme"); } catch {}
        if (s !== "light" && s !== "dark") s = "light";
        document.documentElement.dataset.scheme = s;
        // The tab icon and browser bar follow the app's theme, not the computer's:
        // the same values as BROWSER in src/state/scheme.ts.
        if (s === "dark") {
          document.getElementById("icon").href = "/favicon-dark.svg";
          document.getElementById("icon-png").href = "/favicon-dark-32.png";
          document.getElementById("bar").content = "#0c0c10";
        }
      })();
    </script>
  </head>
  <body spellcheck="false">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
