    <link id="icon-png" rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Findingsmith",
        "url": "https://findingsmith.0xexploitlabs.org/",
        "description": "Write penetration test reports in Markdown, score findings with CVSS 3.1 and 4.0, and export a clean PDF. Runs entirely in your browser.",
        "applicationCategory": "SecurityApplication",
        "operatingSystem": "Any web browser",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "license": "https://github.com/0xExploitLabs/findingsmith#license",
        "sameAs": ["https://github.com/0xExploitLabs/findingsmith"],
        "publisher": {
          "@type": "Organization",
          "name": "0xExploitLabs",
          "url": "https://0xexploitlabs.org",
          "sameAs": [
            "https://github.com/0xExploitLabs",
            "https://www.linkedin.com/company/144596930/",
            "https://x.com/0xExploitLabs",
            "https://www.instagram.com/0xexploitlabs/"
          ]
        }
      }
    </script>
    <meta id="bar" name="theme-color" content="#f8f8fa" />
    <script>
      (() => {
        var s;
        try { s = localStorage.getItem("debrief-scheme"); } catch {}
        if (s !== "light" && s !== "dark") s = "light";
        document.documentElement.dataset.scheme = s;
        // The tab icon and browser bar follow the app's theme, not the computer's:
        // the same values as BROWSER in src/state/scheme.ts.
        if (s === "dark") {
          document.getElementById("icon").href = "/favicon-dark.svg";
          document.getElementById("icon-png").href = "/favicon-dark-32.png";
          document.getElementById("bar").content = "#0c0c10";
        }
      })();
    </script>
  </head>
  <body spellcheck="false">
    <div id="root">
      <noscript>
        <div class="mx-auto max-w-xl px-6 py-24">
          <h1 class="font-display text-5xl tracking-[-0.01em] italic">Findingsmith - pentest reports, written like notes</h1>
          <p class="mt-6 text-base text-ink-muted">
            Write penetration test reports in Markdown, score findings with CVSS 3.1 and 4.0, and
            export a clean PDF. Runs entirely in your browser, so turn on JavaScript to use it.
          </p>
          <p class="mt-6 text-base">
            <a class="underline" href="https://github.com/0xExploitLabs/findingsmith">Source on GitHub</a>
          </p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
